[build]
  command = "npm run build"
  publish = "dist"

# ── Old URLs đã xóa sau refactor → 301 về URL mới ──
[[redirects]]
  from = "/resources/courses"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/resources/tools"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/category/2d-animation"
  to = "/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/"
  status = 301

# ── Pagination pages không còn đủ content ──
[[redirects]]
  from = "/style/:slug/2"
  to = "/style/:slug"
  status = 301

[[redirects]]
  from = "/style/:slug/3"
  to = "/style/:slug"
  status = 301

[[redirects]]
  from = "/sound/:slug/2"
  to = "/sound/:slug"
  status = 301

[[redirects]]
  from = "/industry/:slug/3"
  to = "/industry/:slug"
  status = 301
